name: Request central signer release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: signing-control-central-release
  cancel-in-progress: false
jobs:
  request:
    if: github.repository == 'susanbeasles/signing_control'
    uses: susanbeasles/workflow_depot/.github/workflows/request-deployment.yml@126560f32ed6d4c09914e8b88fac39d93df4e703
    with:
      target: signing-control
      depot_ref: 126560f32ed6d4c09914e8b88fac39d93df4e703
    secrets:
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
