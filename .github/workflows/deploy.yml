name: Request central signer release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: signing-control-central-release
  cancel-in-progress: false
jobs:
  request:
    if: github.repository == 'susanbeasles/signer' && github.repository_id == '1416201242'
    uses: susanbeasles/workflow_depot/.github/workflows/request-deployment.yml@9f78454c5a579aa4955ad481171d4eba633038fb
    with:
      target: signing-control
      depot_ref: 9f78454c5a579aa4955ad481171d4eba633038fb
    secrets:
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
