name: Validate and request central signer release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: signing-control-central-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'susanbeasles/signer' && github.repository_id == '1416201242'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signer and bootstrap invariants
        run: npm test
  request:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'susanbeasles/signer' && github.repository_id == '1416201242'
    uses: susanbeasles/workflow_depot/.github/workflows/request-deployment.yml@9f78454c5a579aa4955ad481171d4eba633038fb
    with:
      target: signing-control
      depot_ref: 9f78454c5a579aa4955ad481171d4eba633038fb
    secrets:
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
