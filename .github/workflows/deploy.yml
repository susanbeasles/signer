name: Deploy standalone signer
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: signing-control-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'susanbeasles/signing_control'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned deployment tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy Worker and matching container automatically
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SIGNING_DEPLOYMENT_JSON: ${{ vars.SIGNING_DEPLOYMENT_JSON }}
